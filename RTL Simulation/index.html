<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore RTL hierarchy, block schematics, and signal connectivity in RTL2GDS Cockpit.">
  <title>RTL2GDS Cockpit</title>
  <link rel="stylesheet" href="/workbench.css">
  <script src="/cockpit.js" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/" aria-label="RTL2GDS Cockpit home" aria-current="page">
      <span class="mark" aria-hidden="true"></span>
      <span>RTL2GDS Cockpit</span>
    </a>
    <nav class="workflow-nav" aria-label="Workflows">
      <a href="/workbench.html">Understanding your design</a>
    </nav>
  </header>

  <main class="cockpit-home">
    <div class="cockpit-greeting">
      <h1>Hello!</h1>
      <p>What are you looking for today?</p>
    </div>
    <section class="workflow-deck" aria-labelledby="highlights-title">
      <div class="workflow-gallery" id="workflow-gallery" role="group" aria-label="Workflow previews"></div>
      <section class="workflow-highlight" aria-labelledby="highlights-title">
        <h2 id="highlights-title">Get the highlights.</h2>
        <div class="workflow-tabs" id="workflow-tabs" role="group" aria-label="Highlights"></div>
        <div id="workflow-window"></div>
        <div class="workflow-copy" id="workflow-copy" aria-live="polite"></div>
        <a class="workflow-cta" href="/workbench.html">Open design workbench</a>
      </section>
      <div class="workflow-pagination" aria-label="Preview navigation" hidden>
        <button type="button" id="previous-workflow" class="preview-step" aria-label="Previous preview">‹</button>
        <div class="preview-pages" id="workflow-pages"></div>
        <button type="button" id="next-workflow" class="preview-step" aria-label="Next preview">›</button>
        <output id="workflow-count" class="preview-count" aria-label="Current preview"></output>
      </div>
      <button type="button" class="workflow-chooser" id="choose-workflow" hidden>Choose a workflow preview</button>
    </section>
  </main>
</body>
</html>
