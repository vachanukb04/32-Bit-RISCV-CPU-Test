<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Understanding your design · RTL2GDS Cockpit</title>
  <link rel="stylesheet" href="/workbench.css">
  <script src="/schematic-graph.js" defer></script>
  <script src="/schematic-layout.js" defer></script>
  <script src="/schematic.js" defer></script>
  <script src="/workbench.js" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/" aria-label="RTL2GDS Cockpit home">
      <span class="mark" aria-hidden="true"></span>
      <span>RTL2GDS Cockpit</span>
    </a>
    <nav class="workflow-nav" aria-label="Workflows">
      <a href="/workbench.html" aria-current="page">Understanding your design</a>
    </nav>
  </header>
  <main class="workbench" aria-label="Understanding your design">
    <section class="project panel" aria-labelledby="project-title">
      <div class="section-head"><h2 id="project-title">Project setup</h2><span id="scan-summary"></span></div>
      <form id="scan">
        <label>RTL root directory or GitHub URL
          <input id="project" value="." spellcheck="false" placeholder="/path/to/rtl or https://github.com/owner/repo">
        </label>
        <label>Source directory (optional)
          <input id="scope" list="directories" placeholder="All source folders" spellcheck="false">
          <datalist id="directories"></datalist>
        </label>
        <button class="button" type="submit">Scan sources</button>
      </form>
      <form id="compile">
        <label>Top module
          <select id="top" disabled><option>Scan sources to find top modules</option></select>
        </label>
        <button class="button primary" id="compile-button" disabled type="submit">Compile &amp; elaborate</button>
      </form>
      <p id="status" class="status" role="status"></p>
    </section>

    <div class="workspace">
      <aside class="panel hierarchy" aria-labelledby="hierarchy-title">
        <div class="section-head"><h2 id="hierarchy-title">Design hierarchy</h2><span id="instance-count"></span></div>
        <div id="tree"><p class="empty">Elaborated instances appear here.</p></div>
      </aside>
      <section class="panel design" aria-labelledby="design-title">
        <div class="section-head"><h2 id="design-title">Block diagram</h2><nav id="crumbs" aria-label="Instance path"></nav></div>
        <div id="diagram"><div class="empty stage-empty">Select a top module to inspect its blocks and signals.</div></div>
        <div id="inspector"></div>
      </section>
    </div>

    <details class="panel output" id="file-panel">
      <summary>Generated file list <span id="file-count"></span></summary>
      <button id="download" type="button" class="button" disabled>Download sources.f</button>
      <ol id="sources"></ol>
      <div id="includes"></div>
    </details>
    <details class="panel output" id="diagnostic-panel">
      <summary>Compiler diagnostics</summary>
      <div id="issues"></div>
      <pre id="diagnostics">No compile has been run.</pre>
    </details>
  </main>
  <dialog id="source-view" aria-labelledby="source-path">
    <div class="source-head">
      <div><h2>RTL source</h2><p id="source-path" class="source"></p></div>
      <form method="dialog"><button class="button" autofocus>Close</button></form>
    </div>
    <div id="source-lines" tabindex="0" aria-label="Source lines"></div>
  </dialog>
</body>
</html>
